canonical_id: rescuenet
display_name: RescueNet
task_type: SEMANTIC_SEGMENTATION
official_reference: https://github.com/BinaLab/RescueNet-A-High-Resolution-Post-Disaster-UAV-Dataset-for-Semantic-Segmentation
citation: "Rahnemoonfar, Chowdhury, and Murphy (2023), RescueNet: a high resolution UAV semantic segmentation dataset for natural disaster damage assessment, Scientific Data."
license_reference: https://creativecommons.org/licenses/by-nc-nd/4.0/
license_review_state: REVIEW_REQUIRED
expected_splits: [train, val, test]
annotation_type: indexed-or-RGB semantic PNG mask
acquisition_methods: [official-manual-download, user-archive, user-directory]
expected_source_structure:
  - official training, validation, and test image sets
  - paired semantic PNG masks or colour masks
source_version_notes: "Official repository describes 4,494 Hurricane Michael UAV images and an approximately 80/10/10 split. Actual archive layout and palette must be inventoried."
preparation_version: segmentation_v1
required_manual_steps:
  - Review the CC BY-NC-ND dataset terms and intended use with the project owner.
  - Download only through the official Dropbox or Figshare access route.
  - Import the accepted archive or extracted directory.
commercial_use_requires_review: true
source_layouts:
  image_directory_tokens: [image, images, org-img, org_img]
  annotation_directory_tokens: [mask, masks, label, labels, label-img, color-mask]
