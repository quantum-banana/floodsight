mappings:
  - {source_id: 0, source_name: background, target_id: 0, target_name: background_other, action: MAP, explanation: "Background and unmodelled scene content.", source_support: bundled-palette-workbook, review_status: SOURCE_FILE_CONFIRMED, colors: [[0, 0, 0]]}
  - {source_id: 1, source_name: building_flooded, target_id: 7, target_name: building_flooded, action: MAP, explanation: "Flood status is distinct from RescueNet damage status.", source_support: bundled-palette-workbook, review_status: SOURCE_FILE_CONFIRMED, colors: [[255, 0, 0]]}
