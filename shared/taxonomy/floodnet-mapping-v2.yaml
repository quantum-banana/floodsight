  - {source_id: 7, source_name: vehicle, target_id: 12, target_name: vehicle, action: MAP, explanation: "Direct semantic vehicle support.", source_support: bundled-palette-workbook, review_status: SOURCE_FILE_CONFIRMED, colors: [[255, 0, 245]]}
