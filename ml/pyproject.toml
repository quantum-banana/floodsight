[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "floodsight-data"
version = "0.3.0"
description = "FloodSight dataset acquisition, validation, conversion, and inspection tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "numpy>=1.26,<3",
  "Pillow>=10.4,<13",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
floodsight-data = "floodsight_data.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["floodsight_data"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
