[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "floodsight-api"
version = "0.1.0"
description = "FloodSight FastAPI foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "PyYAML>=6,<7",
  "pydantic-settings>=2.8,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]
inference = [
  "torch>=2.6",
  "transformers>=4.48",
  "ultralytics>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
